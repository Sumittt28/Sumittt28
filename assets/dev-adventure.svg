<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#21262d"/>
    </linearGradient>
    
    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pixelate">
      <feFlood x="4" y="4" height="2" width="2"/>
      <feComposite width="8" height="8"/>
      <feTile result="a"/>
      <feComposite in="SourceGraphic" in2="a" operator="in"/>
      <feMorphology operator="dilate" radius="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#skyGradient)"/>
  
  <!-- Animated Stars -->
  <g id="stars">
    <circle cx="50" cy="30" r="1.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="60" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="25" r="1.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="50" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="35" r="1.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="55" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="20" r="1.5" fill="#58a6ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="45" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="80" r="1" fill="#7ee787">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="70" r="1" fill="#7ee787">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ground/Platform - Pixel Style -->
  <g id="ground">
    <rect x="0" y="340" width="800" height="60" fill="#238636"/>
    <rect x="0" y="340" width="800" height="8" fill="#2ea043"/>
    <!-- Pixel grass detail -->
    <rect x="20" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="60" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="120" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="200" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="280" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="380" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="480" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="560" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="640" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="720" y="332" width="8" height="8" fill="#2ea043"/>
    <rect x="780" y="332" width="8" height="8" fill="#2ea043"/>
  </g>

  <!-- Pixel Art Developer Character -->
  <g id="developer" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="0.5s" repeatCount="indefinite"/>
    
    <!-- Body -->
    <rect x="96" y="280" width="48" height="52" fill="#1f6feb" rx="4"/>
    
    <!-- Head -->
    <rect x="100" y="248" width="40" height="36" fill="#f0c078" rx="4"/>
    
    <!-- Hair -->
    <rect x="100" y="244" width="40" height="12" fill="#3d2914" rx="2"/>
    <rect x="96" y="248" width="8" height="16" fill="#3d2914"/>
    
    <!-- Eyes -->
    <rect x="108" y="260" width="8" height="8" fill="#fff"/>
    <rect x="124" y="260" width="8" height="8" fill="#fff"/>
    <rect x="110" y="262" width="4" height="4" fill="#000">
      <animate attributeName="x" values="110;112;110" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="126" y="262" width="4" height="4" fill="#000">
      <animate attributeName="x" values="126;128;126" dur="3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Smile -->
    <rect x="112" y="274" width="16" height="4" fill="#000" rx="2"/>
    
    <!-- Arms -->
    <rect x="72" y="288" width="24" height="12" fill="#f0c078" rx="2">
      <animate attributeName="y" values="288;285;288" dur="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="288" width="24" height="12" fill="#f0c078" rx="2">
      <animate attributeName="y" values="288;291;288" dur="0.3s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Legs -->
    <rect x="100" y="332" width="16" height="20" fill="#2f3640"/>
    <rect x="124" y="332" width="16" height="20" fill="#2f3640"/>
    
    <!-- Shoes -->
    <rect x="96" y="348" width="20" height="8" fill="#8b4513" rx="2"/>
    <rect x="124" y="348" width="20" height="8" fill="#8b4513" rx="2"/>
  </g>

  <!-- Laptop/Computer - Pixel Style -->
  <g id="laptop">
    <!-- Screen -->
    <rect x="180" y="270" width="120" height="80" fill="#30363d" rx="4"/>
    <rect x="188" y="278" width="104" height="64" fill="#0d1117" rx="2"/>
    
    <!-- Code on screen - animated -->
    <g fill="#58a6ff" font-family="monospace" font-size="8">
      <text x="192" y="290" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.5;0.9" dur="1s" repeatCount="indefinite"/>
        const dev = {
      </text>
      <text x="196" y="302" fill="#7ee787">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.2s" repeatCount="indefinite"/>
        name: "Sumit"
      </text>
      <text x="196" y="314" fill="#ffa657">
        <animate attributeName="opacity" values="0.8;0.5;0.8" dur="0.8s" repeatCount="indefinite"/>
        role: "Builder"
      </text>
      <text x="196" y="326" fill="#ff7b72">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
        status: "🚀"
      </text>
      <text x="192" y="338" opacity="0.9">}</text>
    </g>
    
    <!-- Keyboard -->
    <rect x="170" y="350" width="140" height="12" fill="#484f58" rx="2"/>
    <rect x="175" y="352" width="130" height="8" fill="#30363d" rx="1"/>
    
    <!-- Typing cursor -->
    <rect x="280" y="324" width="6" height="10" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Floating Code Symbols -->
  <g id="floatingCode" fill="#58a6ff" font-family="monospace" font-size="16" filter="url(#glow)">
    <!-- Left side symbols -->
    <text x="350" y="150">
      <animate attributeName="y" values="150;120;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
      { }
    </text>
    <text x="380" y="200" fill="#7ee787">
      <animate attributeName="y" values="200;170;200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
      &lt;/&gt;
    </text>
    <text x="420" y="120">
      <animate attributeName="y" values="120;90;120" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
      =>
    </text>
    
    <!-- Right side symbols -->
    <text x="500" y="180" fill="#ffa657">
      <animate attributeName="y" values="180;150;180" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.8s" repeatCount="indefinite"/>
      [ ]
    </text>
    <text x="550" y="130">
      <animate attributeName="y" values="130;100;130" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.2s" repeatCount="indefinite"/>
      //
    </text>
    <text x="600" y="200" fill="#ff7b72">
      <animate attributeName="y" values="200;170;200" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.2s" repeatCount="indefinite"/>
      **
    </text>
    <text x="650" y="150" fill="#7ee787">
      <animate attributeName="y" values="150;120;150" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.8s" repeatCount="indefinite"/>
      ()
    </text>
  </g>

  <!-- Floating Tech Icons (Pixel Style) -->
  <g id="techIcons">
    <!-- React Icon -->
    <g transform="translate(480, 280)">
      <animateTransform attributeName="transform" type="translate" values="480,280; 480,270; 480,280" dur="2s" repeatCount="indefinite"/>
      <circle cx="20" cy="20" r="18" fill="none" stroke="#61dafb" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="0 20 20; 360 20 20" dur="8s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="20" cy="20" rx="18" ry="7" fill="none" stroke="#61dafb" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="0 20 20; 360 20 20" dur="8s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="20" cy="20" r="4" fill="#61dafb"/>
    </g>
    
    <!-- Python Icon -->
    <g transform="translate(540, 250)">
      <animateTransform attributeName="transform" type="translate" values="540,250; 540,240; 540,250" dur="2.5s" repeatCount="indefinite"/>
      <rect x="5" y="5" width="30" height="30" fill="#3776ab" rx="4"/>
      <text x="12" y="28" fill="#ffd43b" font-size="20" font-weight="bold">🐍</text>
    </g>
    
    <!-- AI Brain Icon -->
    <g transform="translate(600, 290)">
      <animateTransform attributeName="transform" type="translate" values="600,290; 600,280; 600,290" dur="3s" repeatCount="indefinite"/>
      <rect x="5" y="5" width="30" height="30" fill="#8b5cf6" rx="15"/>
      <text x="10" y="28" fill="#fff" font-size="18">🧠</text>
      <circle cx="20" cy="20" r="18" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.5">
        <animate attributeName="r" values="18;25;18" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Rocket -->
    <g transform="translate(680, 260)">
      <animateTransform attributeName="transform" type="translate" values="680,260; 680,245; 680,260" dur="1.8s" repeatCount="indefinite"/>
      <text x="0" y="25" font-size="28">🚀</text>
      <!-- Rocket trail -->
      <rect x="10" y="30" width="8" height="15" fill="#ffa500" opacity="0.7">
        <animate attributeName="height" values="15;25;15" dur="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="0.3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Coins (Mario Style) -->
  <g id="coins">
    <g transform="translate(720, 300)">
      <animateTransform attributeName="transform" type="translate" values="720,300; 720,290; 720,300" dur="0.6s" repeatCount="indefinite"/>
      <ellipse cx="15" cy="15" rx="12" ry="14" fill="#ffd700"/>
      <ellipse cx="15" cy="15" rx="8" ry="10" fill="#ffec8b"/>
      <text x="9" y="20" fill="#b8860b" font-size="14" font-weight="bold">$</text>
    </g>
    <g transform="translate(680, 320)">
      <animateTransform attributeName="transform" type="translate" values="680,320; 680,310; 680,320" dur="0.7s" repeatCount="indefinite"/>
      <ellipse cx="15" cy="15" rx="12" ry="14" fill="#ffd700"/>
      <ellipse cx="15" cy="15" rx="8" ry="10" fill="#ffec8b"/>
      <text x="9" y="20" fill="#b8860b" font-size="14" font-weight="bold">$</text>
    </g>
  </g>

  <!-- Power-up Block (Mario Style) -->
  <g id="powerBlock" transform="translate(40, 180)">
    <rect x="0" y="0" width="48" height="48" fill="#c84c0c" stroke="#000" stroke-width="2"/>
    <rect x="4" y="4" width="40" height="40" fill="#f8b800"/>
    <rect x="8" y="8" width="8" height="8" fill="#fff"/>
    <rect x="32" y="8" width="8" height="8" fill="#fff"/>
    <rect x="8" y="32" width="8" height="8" fill="#fff"/>
    <rect x="32" y="32" width="8" height="8" fill="#fff"/>
    <text x="14" y="32" fill="#c84c0c" font-size="20" font-weight="bold">?</text>
    <animateTransform attributeName="transform" type="translate" values="40,180; 40,175; 40,180" dur="1s" repeatCount="indefinite"/>
  </g>

  <!-- Message Banner -->
  <g id="banner">
    <rect x="200" y="100" width="400" height="50" fill="#161b22" rx="8" stroke="#30363d" stroke-width="2"/>
    <text x="400" y="132" text-anchor="middle" fill="#58a6ff" font-family="'Courier New', monospace" font-size="18" font-weight="bold" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      ⚡ LEVEL UP: Building Amazing Things ⚡
    </text>
  </g>

  <!-- Score Display (Mario Style) -->
  <g id="score" transform="translate(620, 30)">
    <text x="0" y="20" fill="#fff" font-family="'Press Start 2P', monospace" font-size="12">COMMITS</text>
    <text x="0" y="45" fill="#7ee787" font-family="'Press Start 2P', monospace" font-size="16">
      <animate attributeName="opacity" values="1;0.7;1" dur="0.5s" repeatCount="indefinite"/>
      ∞
    </text>
  </g>

  <!-- Pipe (Mario Style) -->
  <g id="pipe" transform="translate(750, 280)">
    <rect x="0" y="0" width="50" height="60" fill="#2ea043"/>
    <rect x="-5" y="0" width="60" height="20" fill="#2ea043"/>
    <rect x="0" y="0" width="50" height="60" fill="none" stroke="#238636" stroke-width="3"/>
    <rect x="-5" y="0" width="60" height="20" fill="none" stroke="#238636" stroke-width="3"/>
    <rect x="5" y="25" width="15" height="30" fill="#1a7f37" rx="2"/>
  </g>

</svg>
